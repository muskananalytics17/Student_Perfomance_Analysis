<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Math Score Predictor</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #4a90e2;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            border: none;
            border-radius: 7px;
            background: #4a90e2;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #357abd;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            display: none;
        }

        .success {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .error {
            background: #ffebee;
            color: #c62828;
        }

        .score {
            font-size: 32px;
            font-weight: bold;
            margin-top: 8px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Student Math Score Predictor</h1>

        <p class="subtitle">
            Enter student details to predict the mathematics score
        </p>

        <form id="predictionForm">

            <!-- Gender -->
            <div class="form-group">
                <label for="gender">Gender</label>

                <select id="gender" required>
                    <option value="">Select Gender</option>
                    <option value="female">Female</option>
                    <option value="male">Male</option>
                </select>
            </div>


            <!-- Race/Ethnicity -->
            <div class="form-group">
                <label for="race_ethnicity">Race / Ethnicity</label>

                <select id="race_ethnicity" required>
                    <option value="">Select Group</option>
                    <option value="group A">Group A</option>
                    <option value="group B">Group B</option>
                    <option value="group C">Group C</option>
                    <option value="group D">Group D</option>
                    <option value="group E">Group E</option>
                </select>
            </div>


            <!-- Parental Education -->
            <div class="form-group">
                <label for="parental_level_of_education">
                    Parental Level of Education
                </label>

                <select id="parental_level_of_education" required>
                    <option value="">Select Education</option>
                    <option value="some high school">Some High School</option>
                    <option value="high school">High School</option>
                    <option value="some college">Some College</option>
                    <option value="associate's degree">Associate's Degree</option>
                    <option value="bachelor's degree">Bachelor's Degree</option>
                    <option value="master's degree">Master's Degree</option>
                </select>
            </div>


            <!-- Lunch -->
            <div class="form-group">
                <label for="lunch">Lunch</label>

                <select id="lunch" required>
                    <option value="">Select Lunch Type</option>
                    <option value="standard">Standard</option>
                    <option value="free/reduced">Free/Reduced</option>
                </select>
            </div>


            <!-- Test Preparation -->
            <div class="form-group">
                <label for="test_preparation_course">
                    Test Preparation Course
                </label>

                <select id="test_preparation_course" required>
                    <option value="">Select Course Status</option>
                    <option value="none">None</option>
                    <option value="completed">Completed</option>
                </select>
            </div>


            <!-- Reading Score -->
            <div class="form-group">
                <label for="reading_score">Reading Score</label>

                <input
                    type="number"
                    id="reading_score"
                    min="0"
                    max="100"
                    placeholder="Enter reading score"
                    required
                >
            </div>


            <!-- Writing Score -->
            <div class="form-group">
                <label for="writing_score">Writing Score</label>

                <input
                    type="number"
                    id="writing_score"
                    min="0"
                    max="100"
                    placeholder="Enter writing score"
                    required
                >
            </div>


            <button type="submit">
                Predict Math Score
            </button>

        </form>


        <!-- Prediction Result -->

        <div id="result"></div>

    </div>


    <script>

        const form = document.getElementById("predictionForm");
        const result = document.getElementById("result");


        form.addEventListener("submit", async function(event) {

            event.preventDefault();


            const data = {

                gender:
                    document.getElementById("gender").value,

                race_ethnicity:
                    document.getElementById("race_ethnicity").value,

                parental_level_of_education:
                    document.getElementById(
                        "parental_level_of_education"
                    ).value,

                lunch:
                    document.getElementById("lunch").value,

                test_preparation_course:
                    document.getElementById(
                        "test_preparation_course"
                    ).value,

                reading_score:
                    parseFloat(
                        document.getElementById("reading_score").value
                    ),

                writing_score:
                    parseFloat(
                        document.getElementById("writing_score").value
                    )
            };


            try {

                const response = await fetch("/predict", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(data)

                });


                const prediction = await response.json();


                if (response.ok) {

                    result.style.display = "block";

                    result.className = "success";

                    result.innerHTML = `
                        <div>Predicted Math Score</div>
                        <div class="score">
                            ${prediction.predicted_math_score}
                        </div>
                    `;

                } else {

                    result.style.display = "block";

                    result.className = "error";

                    result.innerHTML =
                        "Error: " +
                        (prediction.detail || "Prediction failed");

                }

            } catch (error) {

                result.style.display = "block";

                result.className = "error";

                result.innerHTML =
                    "Unable to connect to the prediction server.";

                console.error(error);

            }

        });

    </script>

</body>

</html>
